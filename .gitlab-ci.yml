build_cuda_image:
  stage: build
  tags:
    - docker
    - build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t sharpai-cuda -f Dockerfile.cuda .
    - docker image tag sharpai-cuda $CI_REGISTRY_IMAGE:cuda-$CI_COMMIT_SHORT_SHA
    - docker image push $CI_REGISTRY_IMAGE:cuda-$CI_COMMIT_SHORT_SHA
    - docker image prune -a

deploy_production:
  needs: 
    - build_cuda_image
  stage: deploy
  allow_failure: false
  only:
   - main
  environment:
    name: prod
  tags:
    - docker
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker stop $CI_PROJECT_NAME || true && docker rm $CI_PROJECT_NAME || true
    - docker run -d --name $CI_PROJECT_NAME -p 0.0.0.0:12080:80 -h sharpai.ksol.it -v /ssd/docker/data/sharpai/:/app/Data/ --gpus all $CI_REGISTRY_IMAGE:cuda-$CI_COMMIT_SHORT_SHA