variables:
  GIT_SUBMODULE_STRATEGY: recursive

before_script:
  - export CI_ENVIRONMENT_HOST=$(echo $CI_ENVIRONMENT_URL | sed 's~http[s]*://~~g')

stages:
 - build
 - deploy

